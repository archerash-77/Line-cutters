<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>Line Cutters</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0f1117;color:#e8e8e0;font-family:monospace;}
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="msg" style="padding:20px;color:#c8f55a;">Loading...</div>
  <script>
  window.onerror = function(m,s,l) {
    document.getElementById('msg').innerHTML = '<b style="color:red">ERROR:</b> '+m+' line:'+l;
    return false;
  };
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
  var useState = React.useState;
  var useRef = React.useRef;
  var useEffect = React.useEffect;
  </script>
  <script src="app.js"></script>
  <script>
  if (typeof ArcheryScorer !== 'undefined') {
    var root = ReactDOM.createRoot(document.getElementById('root'));
    document.getElementById('msg').style.display = 'none';
    root.render(React.createElement(ArcheryScorer));
  } else {
    document.getElementById('msg').textContent = 'ERROR: ArcheryScorer not found';
  }
  </script>
</body>
</html>
